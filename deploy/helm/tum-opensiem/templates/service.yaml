apiVersion: v1
kind: Service
metadata:
  name: {{ include "tum-opensiem.fullname" . }}
  labels:
    {{- include "tum-opensiem.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.syslogUdpPort }}
      targetPort: syslog-udp
      protocol: UDP
      name: syslog-udp
    - port: {{ .Values.service.syslogTcpPort }}
      targetPort: syslog-tcp
      protocol: TCP
      name: syslog-tcp
  selector:
    {{- include "tum-opensiem.selectorLabels" . | nindent 4 }}
