apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tum-opensiem.fullname" . }}
  labels:
    {{- include "tum-opensiem.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tum-opensiem.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tum-opensiem.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tum-opensiem.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5200
              protocol: TCP
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 514
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.siemConfig.environment | quote }}
            - name: ASPNETCORE_URLS
              value: "http://+:5200"
            - name: CLICKHOUSE_ENDPOINT
              {{- if .Values.clickhouse.enabled }}
              value: "http://{{ include "tum-opensiem.fullname" . }}-clickhouse:8123"
              {{- else }}
              value: {{ .Values.clickhouse.externalEndpoint | quote }}
              {{- end }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.clickhouse.password | quote }}
            - name: TUM_RISK_THRESHOLD
              value: {{ .Values.siemConfig.alertRiskThreshold | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: worm-data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config-volume
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
      volumes:
        - name: worm-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tum-opensiem.fullname" . }}-worm-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config-volume
          configMap:
            name: {{ include "tum-opensiem.fullname" . }}-config
