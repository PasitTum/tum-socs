title: AI Agent Unauthorized Credential and Secret Exfiltration Probe
id: c4d5e6f7-a8b9-0123-def0-234567890123
status: stable
description: Detects AI tools or hijacked agent processes attempting to read sensitive host secrets, private keys, or environment configuration files
level: critical
tags:
    - attack.credential_access
    - attack.t1552
    - owasp.llm06
    - atlas.aml.t0035
logsource:
    category: agentic_runtime
    product: tumlog
detection:
    selection:
        PayloadSanitized|contains:
            - '.env'
            - 'id_rsa'
            - 'id_ed25519'
            - 'credentials.json'
            - '/etc/shadow'
            - '/etc/passwd'
            - 'appsettings.Production.json'
            - 'service-account.json'
    condition: selection
falsepositives:
    - Authorized secret management rotation scripts running in CI/CD pipeline
